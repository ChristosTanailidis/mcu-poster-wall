<title>MCU Watch Order — Poster Wall</title>
<style>
  :root {
    --bg: #f3f2ef;
    --bg-raised: #ffffff;
    --ink: #171613;
    --ink-muted: #6b675d;
    --border: #dedad0;
    --accent: #c1611c;
    --accent-ink: #ffffff;
    --seal-red: #a93226;
    --moss: #5f7a4f;
    --shadow: rgba(23, 22, 19, 0.16);
    --scrim: rgba(10, 9, 7, 0.86);
    --chip-bg: rgba(15, 14, 12, 0.55);
    --ring: rgba(255, 255, 255, 0.75);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210;
      --bg-raised: #1c1a17;
      --ink: #efe9dc;
      --ink-muted: #948c79;
      --border: #322f28;
      --accent: #e0904a;
      --accent-ink: #17130b;
      --seal-red: #e0685a;
      --moss: #8faa79;
      --shadow: rgba(0, 0, 0, 0.5);
      --scrim: rgba(6, 5, 4, 0.9);
      --chip-bg: rgba(0, 0, 0, 0.55);
      --ring: rgba(255, 255, 255, 0.65);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131210;
    --bg-raised: #1c1a17;
    --ink: #efe9dc;
    --ink-muted: #948c79;
    --border: #322f28;
    --accent: #e0904a;
    --accent-ink: #17130b;
    --seal-red: #e0685a;
    --moss: #8faa79;
    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(6, 5, 4, 0.9);
    --chip-bg: rgba(0, 0, 0, 0.55);
    --ring: rgba(255, 255, 255, 0.65);
  }
  :root[data-theme="light"] {
    --bg: #f3f2ef;
    --bg-raised: #ffffff;
    --ink: #171613;
    --ink-muted: #6b675d;
    --border: #dedad0;
    --accent: #c1611c;
    --accent-ink: #ffffff;
    --seal-red: #a93226;
    --moss: #5f7a4f;
    --shadow: rgba(23, 22, 19, 0.16);
    --scrim: rgba(10, 9, 7, 0.86);
    --chip-bg: rgba(15, 14, 12, 0.55);
    --ring: rgba(255, 255, 255, 0.75);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 14px max(20px, env(safe-area-inset-left));
  }
  .bar {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .bar-top { flex-wrap: nowrap; }
  .bar-top .title-block { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .bar-top .title-block h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-top #q { flex: 1 1 auto; min-width: 0; }

  .filters-btn {
    display: none;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 13px;
    background: var(--bg-raised);
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 9px 12px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .filters-btn[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .filter-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--seal-red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
  }
  .filters-btn[aria-expanded="true"] .filter-count { background: rgba(255,255,255,0.3); }

  .filters-panel { margin-top: 12px; }
  .title-block { display: flex; flex-direction: column; gap: 1px; margin-right: 6px; }
  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  .view-link {
    font-size: 11px;
    color: var(--ink-muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .view-link:hover { color: var(--accent); border-color: var(--accent); }

  input[type="search"], select {
    font: inherit;
    font-size: 13px;
    background: var(--bg-raised);
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 7px 10px;
    border-radius: 7px;
  }
  input[type="search"] { width: 190px; }
  input[type="search"]:focus, select:focus, button:focus-visible, .tile:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .seg {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .seg button {
    font: inherit;
    font-size: 12.5px;
    background: var(--bg-raised);
    color: var(--ink-muted);
    border: none;
    padding: 7px 12px;
    cursor: pointer;
    border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

  .seg.multi button[data-val="Essential"][aria-pressed="true"] { background: var(--seal-red); color: #fff; }
  .seg.multi button[data-val="Recommended"][aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg.multi button[data-val="Completionist"][aria-pressed="true"] { background: var(--moss); color: #fff; }

  .spacer { flex: 1; }
  .progress-text {
    font-size: 12px;
    color: var(--ink-muted);
    white-space: nowrap;
  }
  .progress-text b { color: var(--ink); }

  /* ---------- grid ---------- */
  main { max-width: 1400px; margin: 0 auto; padding: 22px 20px 60px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px 14px;
  }

  .tile {
    position: relative;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-raised);
    box-shadow: 0 1px 3px var(--shadow);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .tile:hover, .tile.expanded, .tile:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px var(--shadow);
    z-index: 5;
  }
  .tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 15%;
  }
  .tile img.poster-bg {
    filter: blur(16px) brightness(0.6) saturate(1.1);
    transform: scale(1.2);
    object-position: center center;
  }
  .tile img.poster-fg.is-landscape {
    object-fit: contain;
    object-position: center center;
  }
  .tile.no-art { display: flex; align-items: center; justify-content: center; padding: 10px; }
  .tile.no-art .fallback-title {

    FIELDS.forEach((f, i) => o[f] = row[i]);
    return o;
  });

  // Official poster art, sourced from Wikipedia/Wikimedia film & series infobox images.
  const POSTER_FILES = {
    1: "images/001.jpg", 2: "images/002.jpg", 3: "images/003.jpg", 4: "images/004.jpg",
    5: "images/005.jpg", 6: "images/006.jpg", 7: "images/007.jpg", 8: "images/008.png",
    9: "images/009.jpg", 10: null, 11: "images/011.jpg", 12: "images/012.jpg",
    13: "images/013.jpg", 14: "images/014.jpg", 15: "images/015.jpg", 16: "images/016.jpg",
    17: "images/017.jpg", 18: "images/018.jpg", 19: "images/019.jpg", 20: "images/020.jpg",
    21: "images/021.jpg", 22: "images/022.jpg", 23: "images/023.jpg", 24: "images/024.jpg",
    25: "images/025.jpg", 26: "images/026.png", 27: "images/027.png", 28: "images/028.jpg",
    29: "images/029.jpg", 30: "images/030.png", 31: "images/031.jpg", 32: "images/032.jpg",
    33: "images/033.jpg", 34: "images/034.jpg", 35: "images/035.jpg", 36: "images/036.jpg",
    37: "images/037.png", 38: "images/038.png", 39: "images/039.jpg", 40: "images/040.jpg",
    41: "images/041.jpg", 42: "images/042.jpg", 43: "images/043.jpg", 44: "images/044.jpg",
    45: "images/045.jpg", 46: "images/046.png", 47: "images/047.png", 48: "images/048.png",
    49: "images/049.png", 50: "images/050.jpg", 51: "images/051.png", 52: "images/052.jpg",
    53: "images/053.jpg", 54: "images/054.jpg", 55: "images/055.jpg", 56: "images/056.png",
    57: "images/057.jpg", 58: "images/058.jpg", 59: "images/059.jpg", 60: "images/060.jpg",
    61: "images/061.jpg", 62: "images/062.jpg", 63: "images/063.png", 64: "images/064.jpg",
    65: "images/065.jpg", 66: "images/066.jpg", 67: "images/067.jpg", 68: "images/068.jpg",
    69: "images/069.jpg", 70: "images/070.jpg", 71: "images/071.png", 72: "images/072.jpg",
    73: "images/073.jpg", 74: "images/074.png", 75: "images/075.jpg", 76: "images/076.jpg",
    77: "images/077.jpg", 78: "images/078.jpg", 79: null, 80: "images/080.jpg",
    81: "images/081.jpg", 82: "images/082.jpg", 83: "images/083.jpg",
  };

  const TYPE_LABEL = {
    "Movie": "Movie", "TV Series": "TV", "Mini-Series": "Mini",
    "Special": "Special", "Animated Short": "Short", "One-Shot": "1-Shot"
  };
  const TYPE_TINT = {
    "Movie": "#3e6b99", "TV Series": "#7a4c6b", "Mini-Series": "#8e6b3e",
    "Special": "#4c7a6b", "Animated Short": "#6b7a3e", "One-Shot": "#6b6b6b"
  };
  const PRIORITY_VAR = { "Essential": "--seal-red", "Recommended": "--accent", "Completionist": "--moss" };

  const STORE_KEY = "tva-sacred-timeline-watchlist-v1";
  function loadWatched() {
    try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY)) || []); }
    catch (e) { return new Set(); }
  }
  function saveWatched(set) {
    localStorage.setItem(STORE_KEY, JSON.stringify([...set]));
  }
  let watched = loadWatched();

  function readableRuntime(min) {
    if (min == null) return "—";
    if (min < 60) return min + "m";
    if (min < 1440) {
      const h = Math.floor(min / 60), m = min % 60;
      return h + "h" + (m ? " " + m + "m" : "");
    }
    const d = Math.floor(min / 1440), rem = min % 1440;
    const h = Math.floor(rem / 60), m = rem % 60;
    let out = d + "d";
    if (h) out += " " + h + "h";
    if (m) out += " " + m + "m";
    return out;
  }
  function doomsdayColor(pct) {
    if (pct == null) return "rgba(255,255,255,0.3)";
    if (pct >= 80) return "var(--seal-red)";
    if (pct >= 50) return "var(--accent)";
    if (pct >= 20) return "#d4a017";
    return "var(--moss)";
  }
  function formatReleaseDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }
  function escapeHTML(s) {
    if (s == null) return "";
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  const CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.2 12L13 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function tileHTML(m) {
    const posterFile = POSTER_FILES[m.id];
    const isWatched = watched.has(m.id);
    const priorityVar = m.priority ? PRIORITY_VAR[m.priority] : null;
    const priorityColor = priorityVar ? `var(${priorityVar})` : "rgba(255,255,255,0.25)";
    const typeLabel = TYPE_LABEL[m.type] || m.type;
    const doomsdayVal = m.doomsday != null ? m.doomsday + "%" : "—";
    const rtCritics = m.rtCritics != null ? m.rtCritics + "%" : "—";
    const rtAudience = m.rtAudience != null ? m.rtAudience + "%" : "—";

    const artHTML = posterFile
      ? `<img class="poster-bg" src="${posterFile}" alt="" aria-hidden="true" loading="lazy">
         <img class="poster-fg" src="${posterFile}" alt="${escapeHTML(m.title)} poster" loading="lazy">`
      : `<div class="fallback-title">${escapeHTML(m.title)}</div>`;

    return `
    <article class="tile${posterFile ? "" : " no-art"}" data-id="${m.id}" tabindex="0"
              style="background:${TYPE_TINT[m.type] || "#555"};">
      ${artHTML}
      <span class="chip type">${typeLabel}</span>
      <button type="button" class="watch-toggle${isWatched ? " watched" : ""}" data-action="toggle" aria-pressed="${isWatched}" aria-label="${isWatched ? "Mark unwatched" : "Mark watched"}">
        ${CHECK_SVG}
      </button>
      <div class="priority-bar" style="background:${priorityColor}"></div>
      <div class="caption">${escapeHTML(m.title)}</div>
      <div class="detail">
        <div class="d-title">${escapeHTML(m.title)}</div>
        <div class="d-meta">${escapeHTML(m.setIn)} · ${readableRuntime(m.runtime)}</div>
        <div class="d-meta">Released ${formatReleaseDate(m.releaseDate)}</div>
        ${m.priority ? `<div class="d-priority" style="color:${priorityColor}">${m.priority}</div>` : ""}
        <div class="d-row">
          <span>Doomsday</span>
          <div class="d-bar"><div class="d-bar-fill" style="width:${m.doomsday ?? 0}%; background:${doomsdayColor(m.doomsday)}"></div></div>
          <span class="mono">${doomsdayVal}</span>
        </div>
        <div class="d-rt">RT ${rtCritics} critics · ${rtAudience} audience</div>
        <div class="d-notes">${escapeHTML(m.notes)}</div>
      </div>
    </article>`;
  }

  function rowHTML(m) {
    const posterFile = POSTER_FILES[m.id];
    const isWatched = watched.has(m.id);
    const priorityVar = m.priority ? PRIORITY_VAR[m.priority] : null;
    const priorityColor = priorityVar ? `var(${priorityVar})` : "var(--ink-muted)";
    const typeLabel = TYPE_LABEL[m.type] || m.type;
    const doomsdayVal = m.doomsday != null ? m.doomsday + "%" : "—";
    const rtCritics = m.rtCritics != null ? m.rtCritics + "%" : "—";
    const rtAudience = m.rtAudience != null ? m.rtAudience + "%" : "—";
    const thumb = posterFile
      ? `<img class="thumb" src="${posterFile}" alt="" loading="lazy">`
      : `<div class="thumb" style="background:${TYPE_TINT[m.type] || "#555"}"></div>`;

    return `
    <tr data-id="${m.id}" class="${isWatched ? "is-watched" : ""}">
      <td class="col-num mono">${m.id}</td>
      <td class="col-thumb">${thumb}</td>
      <td class="col-title">${escapeHTML(m.title)}</td>
      <td><span class="type-chip" style="background:${TYPE_TINT[m.type] || "#555"}">${typeLabel}</span></td>
      <td><span class="priority-text" style="color:${priorityColor}">${m.priority || "—"}</span></td>
      <td>${escapeHTML(m.setIn)}</td>
      <td class="mono">${formatReleaseDate(m.releaseDate)}</td>
      <td class="mono">${readableRuntime(m.runtime)}</td>
      <td class="mono">${doomsdayVal}</td>
      <td class="mono">${rtCritics}</td>
      <td class="mono">${rtAudience}</td>
      <td class="col-watch">
        <button type="button" class="watch-toggle${isWatched ? " watched" : ""}" data-action="toggle" aria-pressed="${isWatched}" aria-label="${isWatched ? "Mark unwatched" : "Mark watched"}">
          ${CHECK_SVG}
        </button>
      </td>
    </tr>`;
  }

  const state = { q: "", type: "all", watch: "all", priorities: new Set(), sort: "chrono", view: "grid" };

  function populateSelect(id, values, allLabel) {
    const el = document.getElementById(id);
    el.innerHTML = `<option value="all">${allLabel}</option>` +
      values.map(v => `<option value="${v}">${v}</option>`).join("");
  }
  populateSelect("f-type", [...new Set(MOVIES.map(m => m.type))], "All Types");

  function applyFilters() {
    return MOVIES.filter(m => {
      if (state.type !== "all" && m.type !== state.type) return false;
      if (state.priorities.size > 0 && !state.priorities.has(m.priority)) return false;
      if (state.watch === "watched" && !watched.has(m.id)) return false;
      if (state.watch === "unwatched" && watched.has(m.id)) return false;
      if (state.q) {
        const hay = (m.title + " " + m.notes).toLowerCase();
        if (!hay.includes(state.q)) return false;
      }
      return true;
    });
  }

  function sortList(list) {
    const arr = list.slice();
    if (state.sort === "release") arr.sort((a, b) => (a.releaseDate || "9999").localeCompare(b.releaseDate || "9999"));
    else if (state.sort === "doomsday") arr.sort((a, b) => (b.doomsday ?? -1) - (a.doomsday ?? -1));
    else if (state.sort === "rt") arr.sort((a, b) => (b.rtCritics ?? -1) - (a.rtCritics ?? -1));
    else if (state.sort === "priority") {
      const rank = { "Essential": 0, "Recommended": 1, "Completionist": 2 };
      arr.sort((a, b) => (rank[a.priority] ?? 3) - (rank[b.priority] ?? 3) || a.id - b.id);
    } else if (state.sort === "title") {
      arr.sort((a, b) => a.title.localeCompare(b.title));
    }
    // "chrono" needs no sort: MOVIES is already in chronological order.
    return arr;
  }

  const grid = document.getElementById("grid");
  const tableWrap = document.getElementById("table-wrap");
  const tableBody = document.getElementById("table-body");
  const emptyState = document.getElementById("empty-state");

  function render() {
    const list = sortList(applyFilters());
    if (state.view === "table") {
      grid.hidden = true;
      grid.innerHTML = "";
      tableWrap.hidden = false;
      tableBody.innerHTML = list.map(rowHTML).join("");
    } else {
      tableWrap.hidden = true;
      tableBody.innerHTML = "";
      grid.hidden = false;
      grid.innerHTML = list.map(tileHTML).join("");
      fitPosterImages();
    }
    emptyState.hidden = list.length !== 0;
    updateStats();
  }

  // Landscape source art (mostly TV-show logos) gets letterboxed on top of a
  // blurred cover of the same image, instead of being cropped or matted with
  // a flat color, since cover-cropping cuts off titles on anything wider than tall.
  function fitPosterImages() {
    grid.querySelectorAll(".tile img.poster-fg").forEach(img => {
      const check = () => {
        if (img.naturalWidth && img.naturalHeight && img.naturalWidth / img.naturalHeight > 1.05) {
          img.classList.add("is-landscape");
        }
      };
      if (img.complete) check();
      else img.addEventListener("load", check, { once: true });
    });
  }

  function updateStats() {
    document.getElementById("total-count").textContent = MOVIES.length;
    document.getElementById("watched-count").textContent = MOVIES.filter(m => watched.has(m.id)).length;
    updateFilterBadge();
  }

  function updateFilterBadge() {
    const count = (state.type !== "all" ? 1 : 0) + state.priorities.size + (state.watch !== "all" ? 1 : 0);
    const badge = document.getElementById("filter-count");
    badge.textContent = count;
    badge.hidden = count === 0;
  }

  document.getElementById("filters-toggle").addEventListener("click", () => {
    const panel = document.getElementById("filters-panel");
    const btn = document.getElementById("filters-toggle");
    const nowOpen = !panel.classList.contains("open");
    panel.classList.toggle("open", nowOpen);
    btn.setAttribute("aria-expanded", nowOpen);
  });

  document.getElementById("q").addEventListener("input", e => {
    state.q = e.target.value.trim().toLowerCase();
    render();
  });
  document.getElementById("f-type").addEventListener("change", e => { state.type = e.target.value; render(); });
  document.getElementById("priority-filter").addEventListener("click", e => {
    const btn = e.target.closest("button[data-val]");
    if (!btn) return;
    const val = btn.dataset.val;
    const nowOn = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", nowOn);
    if (nowOn) state.priorities.add(val); else state.priorities.delete(val);
    render();
  });
  document.getElementById("watch-toggle-group").addEventListener("click", e => {
    const btn = e.target.closest("button[data-val]");
    if (!btn) return;
    state.watch = btn.dataset.val;
    [...btn.parentElement.children].forEach(b => b.setAttribute("aria-pressed", b === btn));
    render();
  });
  document.getElementById("f-sort").addEventListener("change", e => { state.sort = e.target.value; render(); });

  const VIEW_KEY = "mcu-poster-wall-view-v1";
  document.getElementById("view-toggle-group").addEventListener("click", e => {
    const btn = e.target.closest("button[data-val]");
    if (!btn) return;
    state.view = btn.dataset.val;
    [...btn.parentElement.children].forEach(b => b.setAttribute("aria-pressed", b === btn));
    localStorage.setItem(VIEW_KEY, state.view);
    render();
  });

  function handleWatchOrExpandClick(e) {
    const watchBtn = e.target.closest(".watch-toggle");
    const item = e.target.closest("[data-id]");
    if (!item) return;
    const id = Number(item.dataset.id);

    if (watchBtn) {
      if (watched.has(id)) watched.delete(id); else watched.add(id);
      saveWatched(watched);
      const nowWatched = watched.has(id);
      watchBtn.classList.toggle("watched", nowWatched);
      watchBtn.setAttribute("aria-pressed", nowWatched);
      item.classList.toggle("is-watched", nowWatched);
      updateStats();
      if (state.watch !== "all") setTimeout(render, 200);
      return;
    }
    // touch/click on a poster card (not a table row) toggles the detail overlay
    if (item.classList.contains("tile")) {
      document.querySelectorAll(".tile.expanded").forEach(t => { if (t !== item) t.classList.remove("expanded"); });
      item.classList.toggle("expanded");
    }
  }
  grid.addEventListener("click", handleWatchOrExpandClick);
  tableBody.addEventListener("click", handleWatchOrExpandClick);

  document.addEventListener("click", e => {
    if (!e.target.closest(".tile")) {
      document.querySelectorAll(".tile.expanded").forEach(t => t.classList.remove("expanded"));
    }
  });

  const savedView = localStorage.getItem(VIEW_KEY);
  if (savedView === "table" || savedView === "grid") {
    state.view = savedView;
    const grp = document.getElementById("view-toggle-group");
    [...grp.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.val === savedView));
  }

  render();
})();
</script>
</body>
</html>
