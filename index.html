<title>MCU Watch Order — Poster Wall</title>
<style>
  :root {
    --bg: #f3f2ef;
    --bg-raised: #ffffff;
    --ink: #171613;
    --ink-muted: #6b675d;
    --border: #dedad0;
    --accent: #c1611c;
    --accent-ink: #ffffff;
    --seal-red: #d4141c;
    --moss: #5f7a4f;
    --shadow: rgba(23, 22, 19, 0.16);
    --scrim: rgba(10, 9, 7, 0.86);
    --chip-bg: rgba(15, 14, 12, 0.55);
    --ring: rgba(255, 255, 255, 0.75);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131210;
      --bg-raised: #1c1a17;
      --ink: #efe9dc;
      --ink-muted: #948c79;
      --border: #322f28;
      --accent: #e0904a;
      --accent-ink: #17130b;
      --seal-red: #ff5c54;
      --moss: #8faa79;
      --shadow: rgba(0, 0, 0, 0.5);
      --scrim: rgba(6, 5, 4, 0.9);
      --chip-bg: rgba(0, 0, 0, 0.55);
      --ring: rgba(255, 255, 255, 0.65);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131210;
    --bg-raised: #1c1a17;
    --ink: #efe9dc;
    --ink-muted: #948c79;
    --border: #322f28;
    --accent: #e0904a;
    --accent-ink: #17130b;
    --seal-red: #ff5c54;
    --moss: #8faa79;
    --shadow: rgba(0, 0, 0, 0.5);
    --scrim: rgba(6, 5, 4, 0.9);
    --chip-bg: rgba(0, 0, 0, 0.55);
    --ring: rgba(255, 255, 255, 0.65);
  }
  :root[data-theme="light"] {
    --bg: #f3f2ef;
    --bg-raised: #ffffff;
    --ink: #171613;
    --ink-muted: #6b675d;
    --border: #dedad0;
    --accent: #c1611c;
    --accent-ink: #ffffff;
    --seal-red: #d4141c;
    --moss: #5f7a4f;
    --shadow: rgba(23, 22, 19, 0.16);
    --scrim: rgba(10, 9, 7, 0.86);
    --chip-bg: rgba(15, 14, 12, 0.55);
    --ring: rgba(255, 255, 255, 0.75);
  }

  * { box-sizing: border-box; }
  html {
    height: 100%;
    /* Stops iOS Safari's rubber-band overscroll from leaving the page
       scrolled past the top on load, which hid the sticky header until
       the user dragged the page down manually. */
    overscroll-behavior-y: none;
  }
  body {
    margin: 0;
    min-height: 100%;
    overscroll-behavior-y: none;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  /* Header is deliberately a fixed black/red band regardless of the
     light/dark theme toggle below — every header-internal control still
     reads --bg/--bg-raised/--ink/--ink-muted/--border via var(), so
     redeclaring those four here re-themes the whole bar (and the mobile
     filters dropdown, which lives inside <header>) without touching
     every individual rule. */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    color: var(--ink);
    border-bottom: 3px solid var(--seal-red);
    padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 14px max(20px, env(safe-area-inset-left));
    --bg: #0a0a0a;
    --bg-raised: #1d1d1d;
    --ink: #f5f4f2;
    --ink-muted: #9c9995;
    --border: #38352f;
  }
  .bar {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .bar-top { flex-wrap: nowrap; }
  .bar-top .title-block { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  .bar-top .title-block h1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-top #q { flex: 1 1 240px; min-width: 0; }

  /* Search input, selects, and every filter-row button share one height/shape. */
  input[type="search"], select, .filters-btn, .seg button {
    font: inherit;
    font-size: 13px;
    min-height: 36px;
  }

  .filters-btn {
    display: none;
    align-items: center;
    gap: 6px;
    background: var(--bg-raised);
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 0 12px;
    border-radius: 7px;
    cursor: pointer;
    white-space: nowrap;
  }
  .filters-btn[aria-expanded="true"] { background: var(--seal-red); color: #fff; border-color: var(--seal-red); }
  .filter-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--seal-red);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
  }
  .filters-btn[aria-expanded="true"] .filter-count { background: rgba(255,255,255,0.3); }

  .filters-panel { margin-top: 12px; }
  .title-block {
    display: flex;
    flex-direction: column;
    gap: 1px;
    margin-right: 6px;
    border-left: 3px solid var(--seal-red);
    padding-left: 10px;
  }
  h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-shadow: 0 0 14px rgba(212, 20, 28, 0.55);
  }
  .view-link {
    font-size: 11px;
    color: var(--ink-muted);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .view-link:hover { color: var(--seal-red); border-color: var(--seal-red); }

  input[type="search"], select {
    background: var(--bg-raised);
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 0 12px;
    border-radius: 7px;
  }
  input[type="search"] { width: 190px; }
  input[type="search"]:focus, select:focus, button:focus-visible, .tile:focus-visible {
    outline: 2px solid var(--seal-red);
    outline-offset: 2px;
  }

  .seg {
    display: flex;
    min-height: 36px;
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .seg button {
    background: var(--bg-raised);
    color: var(--ink-muted);
    border: none;
    padding: 0 12px;
    cursor: pointer;
    border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: none; }
  .seg button[aria-pressed="true"] { background: var(--seal-red); color: #fff; }

  .seg.multi button[data-val="Essential"][aria-pressed="true"] { background: var(--seal-red); color: #fff; }
  .seg.multi button[data-val="Recommended"][aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg.multi button[data-val="Completionist"][aria-pressed="true"] { background: var(--moss); color: #fff; }

  .spacer { flex: 1; }
  .progress-text {
    font: inherit;
    font-size: 12px;
    color: var(--ink-muted);
    white-space: nowrap;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: transparent;
  }
  .progress-text:hover, .progress-text:focus-visible { color: var(--seal-red); text-decoration-color: var(--seal-red); }

  /* ---------- version / changelog ---------- */
  .version-badge {

  .modal-foot { padding: 14px 18px; border-top: 1px solid var(--border); text-align: right; }
  .modal-ok {
    font: inherit;

  /* ---------- fullscreen views (stats, movie detail) ---------- */
  .fullscreen-view {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }

  .fullscreen-head {

    gap: 12px;
    flex-shrink: 0;
    background: #0a0a0a;
    color: #f5f4f2;
    border-bottom: 3px solid var(--seal-red);
    padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) 14px max(20px, env(safe-area-inset-left));
  }
  .fullscreen-head h2 {
    margin: 0;
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  /* ---------- stats view ---------- */
  .stats-section + .stats-section { margin-top: 28px; }
  .stats-section-title {
    font-size: 12px;

  .donut-pct { font-size: 16px; font-weight: 800; }
  .donut-hours { font-size: 9px; color: var(--ink-muted); margin-top: 1px; }
  .stat-legend { font-size: 11px; color: var(--ink-muted); display: flex; flex-direction: column; gap: 3px; }
  .stat-legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }

  /* ---------- movie detail view ---------- */
  .detail-container { max-width: 640px; margin: 0 auto; }
  .detail-hero {
    position: relative;
    height: 260px;
    overflow: hidden;

  }
  .detail-hero.no-art { height: 140px; margin-bottom: 24px; }
  .detail-hero-bg {
    position: absolute;

  .detail-action-btn {

  .detail-action-btn.hide.active { background: var(--seal-red); border-color: var(--seal-red); color: #fff; }

  .detail-meter-track { flex: 1; height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .detail-meter-fill { height: 100%; }

  /* ---------- list view ---------- */
  /* Each row is its own rounded card (gap-separated, not divider lines), with
     the poster as a full-bleed cover image and a directional scrim behind the
     text for legibility. A colored .swipe-bg (watch, left-aligned; hide,

  .list-wrap {
    display: flex;

    position: relative;
    border-radius: 10px;

  .list-row.is-watched .list-row-content { opacity: 0.55; }
  .list-row-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
  }
  .list-row-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.68) 38%, rgba(0,0,0,0.22) 72%, rgba(0,0,0,0.4) 100%);
  }
  .list-row-info {
    position: absolute;
    left: 0;
    right: 76px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 12px;
  }
  .list-row-title {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .list-row-meta {
    font-size: 11px;
    color: rgba(255,255,255,0.82);
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
  }
  .list-type-chip {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 3px;
    color: #fff;
    flex-shrink: 0;
  }
  .list-row .watch-toggle { top: 10px; }
  .list-row .hide-toggle { top: 40px; opacity: 1; }

  /* ---------- mobile ---------- */
  @media (max-width: 760px) {
    main {
      padding: 16px 14px max(40px, env(safe-area-inset-bottom));
    }
    .grid { grid-template-columns: repeat(auto-fill, minmax(122px, 1fr)); gap: 12px 10px; }

    .filters-btn { display: inline-flex; }

      display: none;
      flex-direction: column;
      align-items: stretch;
    }
    /* Floats over the grid as a dropdown instead of pushing content down;
       header is position:sticky, which also makes it the containing block. */

      display: flex;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 0;

    input[type="search"], select, .filters-btn { font-size: 16px; padding: 11px 12px; }

    /* Reflow the crowded top bar into three clean rows instead of one

    .bar-top { flex-wrap: wrap; row-gap: 10px; }
    .bar-top .title-block { order: 1; flex: 1 1 auto; min-width: 0; margin-right: 0; }

    .bar-top .filters-btn { order: 4; flex: 0 0 auto; }
    .bar-top #view-toggle-group { order: 5; flex: 0 0 auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile, .caption, .detail, .watch-toggle svg { transition: none; }
  }

<body>

<header>
  <div class="bar bar-top">
    <div class="title-block">
      <h1>MCU Poster Wall</h1>
      <button type="button" class="version-badge" id="version-badge" hidden></button>
    </div>
    <input type="search" id="q" placeholder="Search…" autocomplete="off">
    <button type="button" id="filters-toggle" class="filters-btn" aria-expanded="false" aria-controls="filters-panel">
      Filters<span class="filter-count" id="filter-count" hidden>0</span>

      <button type="button" data-val="Specials" aria-pressed="false">Specials</button>
    </div>
    <div class="seg multi" id="priority-filter" role="group" aria-label="Filter by priority (multiple)">
      <button type="button" data-val="Essential" aria-pressed="false">Essential</button>
      <button type="button" data-val="Recommended" aria-pressed="false">Recommended</button>
      <button type="button" data-val="Completionist" aria-pressed="false">Completionist</button>
    </div>
    <div class="seg" id="watch-toggle-group" role="group" aria-label="Filter by watched status">
      <button type="button" data-val="all" aria-pressed="true">All</button>
      <button type="button" data-val="unwatched" aria-pressed="false">Unwatched</button>
      <button type="button" data-val="watched" aria-pressed="false">Watched</button>
      <button type="button" data-val="hidden" aria-pressed="false">Hidden</button>

    <select id="f-sort">
      <option value="chrono">Sort: Story Order</option>
      <option value="release">Sort: Release Date</option>
      <option value="doomsday">Sort: Doomsday Link %</option>

</header>

<main>

    const rtCritics = m.rtCritics != null ? m.rtCritics + "%" : "—";
    const rtAudience = m.rtAudience != null ? m.rtAudience + "%" : "—";

    const artHTML = posterFile
      ? `<img class="poster-bg" src="${posterFile}" alt="" aria-hidden="true" loading="lazy">
         <img class="poster-fg" src="${posterFile}" alt="${escapeHTML(m.title)} poster" loading="lazy">`
      : `<div class="fallback-title">${escapeHTML(m.title)}</div>`;

    return `
    <article class="tile${posterFile ? "" : " no-art"}" data-id="${m.id}" tabindex="0"
              style="background:${TYPE_TINT[m.type] || "#555"};">
      ${artHTML}
      <span class="chip type">${typeLabel}</span>
      <button type="button" class="watch-toggle${isWatched ? " watched" : ""}" data-action="toggle" aria-pressed="${isWatched}" aria-label="${isWatched ? "Mark unwatched" : "Mark watched"}">
        ${CHECK_SVG}
      </button>
      <button type="button" class="hide-toggle${isHidden ? " is-hidden" : ""}" data-action="hide" aria-pressed="${isHidden}" aria-label="${isHidden ? "Unhide" : "Hide from my list"}">
        ${HIDE_SVG}
      </button>
      <div class="priority-bar" style="background:${priorityColor}"></div>
      <div class="caption">${escapeHTML(m.title)}</div>
      <div class="detail">
        <div class="d-title">${escapeHTML(m.title)}</div>
        <div class="d-meta">${escapeHTML(m.setIn)} · ${readableRuntime(m.runtime)}</div>
        <div class="d-meta">Released ${formatReleaseDate(m.releaseDate)}</div>
        ${m.priority ? `<div class="d-priority" style="color:${priorityColor}">${m.priority}</div>` : ""}
        <div class="d-row">
          <span>Doomsday</span>
          <div class="d-bar"><div class="d-bar-fill" style="width:${m.doomsday ?? 0}%; background:${doomsdayColor(m.doomsday)}"></div></div>
          <span class="mono">${doomsdayVal}</span>
        </div>
        <div class="d-rt">RT ${rtCritics} critics · ${rtAudience} audience</div>
        <div class="d-notes">${escapeHTML(m.notes)}</div>
      </div>
    </article>`;
  }

  function listRowHTML(m) {
    const posterFile = POSTER_FILES[m.id];
    const isWatched = watched.has(m.id);
    const isHidden = hidden.has(m.id);
    const priorityVar = m.priority ? PRIORITY_VAR[m.priority] : null;
    const priorityColor = priorityVar ? `var(${priorityVar})` : "rgba(255,255,255,0.75)";
    const typeLabel = TYPE_LABEL[m.type] || m.type;
    const bgHTML = posterFile
      ? `<img class="list-row-bg" src="${posterFile}" alt="" loading="lazy">`
      : `<div class="list-row-bg" style="background:${TYPE_TINT[m.type] || "#555"}"></div>`;

    return `
    <div class="list-row${isWatched ? " is-watched" : ""}" data-id="${m.id}">
      <div class="swipe-bg watch">${isWatched ? "Unwatch" : "Watched"}</div>
      <div class="swipe-bg hide">${isHidden ? "Unhide" : "Hide"}</div>
      <div class="list-row-content">
        ${bgHTML}
        <div class="list-row-scrim"></div>
        <div class="list-row-info">
          <div class="list-row-title">${escapeHTML(m.title)}</div>
          <div class="list-row-meta">
            <span class="list-type-chip" style="background:${TYPE_TINT[m.type] || "#555"}">${typeLabel}</span>
            ${m.priority ? `<span style="color:${priorityColor}">${m.priority}</span>` : ""}
            <span>${readableRuntime(m.runtime)}</span>
          </div>
        </div>
        <button type="button" class="watch-toggle${isWatched ? " watched" : ""}" data-action="toggle" aria-pressed="${isWatched}" aria-label="${isWatched ? "Mark unwatched" : "Mark watched"}">
          ${CHECK_SVG}
        </button>
        <button type="button" class="hide-toggle${isHidden ? " is-hidden" : ""}" data-action="hide" aria-pressed="${isHidden}" aria-label="${isHidden ? "Unhide" : "Hide from my list"}">
          ${HIDE_SVG}
        </button>
      </div>
    </div>`;
  }

  const state = { q: "", types: new Set(), watch: "all", priorities: new Set(), sort: "chrono", view: "grid" };

  function applyFilters() {
    return MOVIES.filter(m => {
      if (state.watch === "hidden") {
        if (!hidden.has(m.id)) return false;
      } else if (hidden.has(m.id)) {
        return false;
      }
      if (state.types.size > 0 && !state.types.has(TYPE_GROUP[m.type])) return false;
      if (state.priorities.size > 0 && !state.priorities.has(m.priority)) return false;
      if (state.watch === "watched" && !watched.has(m.id)) return false;
      if (state.watch === "unwatched" && watched.has(m.id)) return false;
      if (state.q) {
        const hay = (m.title + " " + m.notes).toLowerCase();
        if (!hay.includes(state.q)) return false;
      }
      return true;
    });
  }

  function sortList(list) {
    const arr = list.slice();
    if (state.sort === "release") arr.sort((a, b) => (a.releaseDate || "9999").localeCompare(b.releaseDate || "9999"));
    else if (state.sort === "doomsday") arr.sort((a, b) => (b.doomsday ?? -1) - (a.doomsday ?? -1));
    else if (state.sort === "rt") arr.sort((a, b) => (b.rtCritics ?? -1) - (a.rtCritics ?? -1));
    else if (state.sort === "priority") {
      const rank = { "Essential": 0, "Recommended": 1, "Completionist": 2 };
      arr.sort((a, b) => (rank[a.priority] ?? 3) - (rank[b.priority] ?? 3) || a.id - b.id);
    } else if (state.sort === "title") {
      arr.sort((a, b) => a.title.localeCompare(b.title));
    }
    // "chrono" needs no sort: MOVIES is already in chronological order.
    return arr;
  }

  const grid = document.getElementById("grid");
  const listWrap = document.getElementById("list-wrap");
  const emptyState = document.getElementById("empty-state");

  function render() {
    const list = sortList(applyFilters());
    if (state.view === "list") {
      grid.hidden = true;
      grid.innerHTML = "";
      listWrap.hidden = false;
      listWrap.innerHTML = list.map(listRowHTML).join("");
    } else {
      listWrap.hidden = true;
      listWrap.innerHTML = "";
      grid.hidden = false;
      grid.innerHTML = list.map(tileHTML).join("");
      fitPosterImages();
    }
    emptyState.hidden = list.length !== 0;
    updateStats();
  }

  // Landscape source art (mostly TV-show logos) gets letterboxed on top of a
  // blurred cover of the same image, instead of being cropped or matted with
  // a flat color, since cover-cropping cuts off titles on anything wider than tall.
  function fitPosterImages() {
    grid.querySelectorAll(".tile img.poster-fg").forEach(img => {
      const check = () => {
        if (img.naturalWidth && img.naturalHeight && img.naturalWidth / img.naturalHeight > 1.05) {
          img.classList.add("is-landscape");
        }
      };
      if (img.complete) check();
      else img.addEventListener("load", check, { once: true });
    });
  }

  function updateStats() {
    const visible = MOVIES.filter(m => !hidden.has(m.id));
    document.getElementById("total-count").textContent = visible.length;
    document.getElementById("watched-count").textContent = visible.filter(m => watched.has(m.id)).length;
    updateFilterBadge();
  }

  function updateFilterBadge() {
    const count = state.types.size + state.priorities.size + (state.watch !== "all" ? 1 : 0);
    const badge = document.getElementById("filter-count");
    badge.textContent = count;
    badge.hidden = count === 0;
  }

  document.getElementById("filters-toggle").addEventListener("click", () => {
    const panel = document.getElementById("filters-panel");
    const btn = document.getElementById("filters-toggle");
    const nowOpen = !panel.classList.contains("open");
    panel.classList.toggle("open", nowOpen);
    btn.setAttribute("aria-expanded", nowOpen);
  });

  const FILTERS_KEY = "mcu-poster-wall-filters-v1";
  function saveFilters() {
    localStorage.setItem(FILTERS_KEY, JSON.stringify({
      q: state.q,
      types: [...state.types],
      priorities: [...state.priorities],
      watch: state.watch,
      sort: state.sort
    }));
  }

  document.getElementById("q").addEventListener("input", e => {
    state.q = e.target.value.trim().toLowerCase();
    saveFilters();
    render();
  });
  document.getElementById("type-filter").addEventListener("click", e => {
    const btn = e.target.closest("button[data-val]");
    if (!btn) return;
    const val = btn.dataset.val;
    const nowOn = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", nowOn);
    if (nowOn) state.types.add(val); else state.types.delete(val);
    saveFilters();
    render();
  });
  document.getElementById("priority-filter").addEventListener("click", e => {
    const btn = e.target.closest("button[data-val]");
    if (!btn) return;
    const val = btn.dataset.val;
    const nowOn = btn.getAttribute("aria-pressed") !== "true";
    btn.setAttribute("aria-pressed", nowOn);
    if (nowOn) state.priorities.add(val); else state.priorities.delete(val);
    saveFilters();
    render();
  });
  document.getElementById("watch-toggle-group").addEventListener("click", e => {
    const btn = e.target.closest("button[data-val]");
    if (!btn) return;
    state.watch = btn.dataset.val;
    [...btn.parentElement.children].forEach(b => b.setAttribute("aria-pressed", b === btn));
    saveFilters();
    render();
  });
  document.getElementById("f-sort").addEventListener("change", e => {
    state.sort = e.target.value;
    saveFilters();
    render();
  });

  const VIEW_KEY = "mcu-poster-wall-view-v1";
  document.getElementById("view-toggle-group").addEventListener("click", e => {
    const btn = e.target.closest("button[data-val]");
    if (!btn) return;
    state.view = btn.dataset.val;
    [...btn.parentElement.children].forEach(b => b.setAttribute("aria-pressed", b === btn));
    localStorage.setItem(VIEW_KEY, state.view);
    render();
  });

  function toggleWatched(id) {
    if (watched.has(id)) watched.delete(id); else watched.add(id);
    saveWatched(watched);
    return watched.has(id);
  }
  function toggleHidden(id) {
    if (hidden.has(id)) hidden.delete(id); else hidden.add(id);
    saveHidden(hidden);
    return hidden.has(id);
  }

  function handleWatchOrExpandClick(e) {
    const watchBtn = e.target.closest(".watch-toggle");
    const hideBtn = e.target.closest(".hide-toggle");
    const item = e.target.closest("[data-id]");
    if (!item) return;
    const id = Number(item.dataset.id);

    if (watchBtn) {
      const nowWatched = toggleWatched(id);
      watchBtn.classList.toggle("watched", nowWatched);
      watchBtn.setAttribute("aria-pressed", nowWatched);
      item.classList.toggle("is-watched", nowWatched);
      updateStats();
      if (state.watch !== "all") setTimeout(render, 200);
      return;
    }
    if (hideBtn) {
      const nowHidden = toggleHidden(id);
      hideBtn.classList.toggle("is-hidden", nowHidden);
      hideBtn.setAttribute("aria-pressed", nowHidden);
      updateStats();
      setTimeout(render, 200);
      return;
    }
    // tap on a poster tile or list row (not on an action button) opens the fullscreen detail view
    if (item.classList.contains("tile") || item.classList.contains("list-row")) {
      openDetailView(id);
    }
  }
  grid.addEventListener("click", handleWatchOrExpandClick);
  listWrap.addEventListener("click", handleWatchOrExpandClick);

  // ---------- list-view swipe gestures (swipe right = watched, swipe left = hide) ----------
  (function initListSwipe() {
    const THRESHOLD = 72;
    const MAX_DRAG = 96;
    let dragging = null;
    let justSwiped = false;

    listWrap.addEventListener("pointerdown", e => {
      if (e.target.closest(".watch-toggle") || e.target.closest(".hide-toggle")) return;
      const content = e.target.closest(".list-row-content");
      if (!content) return;
      dragging = {
        row: content.closest(".list-row"), content,
        startX: e.clientX, startY: e.clientY, dx: 0, axis: null,
        id: Number(content.closest(".list-row").dataset.id), pointerId: e.pointerId
      };
    });

    listWrap.addEventListener("pointermove", e => {
      if (!dragging || dragging.pointerId !== e.pointerId) return;
      const dx = e.clientX - dragging.startX;
      const dy = e.clientY - dragging.startY;
      if (dragging.axis === null) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        dragging.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
        if (dragging.axis === "x") {
          dragging.row.classList.add("dragging");
          dragging.content.setPointerCapture(e.pointerId);
        }
      }
      if (dragging.axis !== "x") return;
      e.preventDefault();
      dragging.dx = Math.max(-MAX_DRAG, Math.min(MAX_DRAG, dx));
      dragging.content.style.transform = `translateX(${dragging.dx}px)`;
      dragging.row.querySelector(".swipe-bg.watch").style.opacity = dragging.dx > 0 ? Math.min(1, dragging.dx / THRESHOLD) : 0;
      dragging.row.querySelector(".swipe-bg.hide").style.opacity = dragging.dx < 0 ? Math.min(1, -dragging.dx / THRESHOLD) : 0;
    });

    function endDrag(e) {
      if (!dragging || dragging.pointerId !== e.pointerId) return;
      const { row, content, dx, axis, id } = dragging;
      dragging = null;
      if (axis !== "x") return;
      // Real mouse drags fire a trailing click the capture-phase listener below
      // consumes; touch drags never fire one at all, so this also self-clears
      // on a timer rather than relying solely on that click showing up.
      justSwiped = true;
      setTimeout(() => { justSwiped = false; }, 350);
      row.classList.remove("dragging");
      content.style.transform = "";
      row.querySelectorAll(".swipe-bg").forEach(bg => bg.style.opacity = "");
      if (dx >= THRESHOLD) {
        const watchBtn = row.querySelector(".watch-toggle");
        const nowWatched = toggleWatched(id);
        watchBtn.classList.toggle("watched", nowWatched);
        watchBtn.setAttribute("aria-pressed", nowWatched);
        row.classList.toggle("is-watched", nowWatched);
        updateStats();
        if (state.watch !== "all") setTimeout(render, 200);
      } else if (dx <= -THRESHOLD) {
        toggleHidden(id);
        updateStats();
        setTimeout(render, 200);
      }
    }
    listWrap.addEventListener("pointerup", endDrag);
    listWrap.addEventListener("pointercancel", endDrag);

    // A mouse-driven drag still fires a synthetic click on release (unlike
    // touch, which suppresses it natively) — swallow that one click so it
    // doesn't also trigger handleWatchOrExpandClick on the dragged row.
    listWrap.addEventListener("click", e => {
      if (justSwiped) {
        justSwiped = false;
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
  })();

  document.addEventListener("click", e => {
    const panel = document.getElementById("filters-panel");
    const toggle = document.getElementById("filters-toggle");
    if (panel.classList.contains("open") && !e.target.closest("#filters-panel") && !e.target.closest("#filters-toggle")) {
      panel.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
    }
  });

  const savedView = localStorage.getItem(VIEW_KEY);
  if (savedView === "list" || savedView === "grid") {
    state.view = savedView;
    const grp = document.getElementById("view-toggle-group");
    [...grp.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.val === savedView));
  }

  (function restoreFilters() {
    let saved;
    try { saved = JSON.parse(localStorage.getItem(FILTERS_KEY)); } catch (e) { saved = null; }
    if (!saved) return;

    if (typeof saved.q === "string") {
      state.q = saved.q;
      document.getElementById("q").value = saved.q;
    }
    if (Array.isArray(saved.types)) {
      state.types = new Set(saved.types);
      const grp = document.getElementById("type-filter");
      [...grp.children].forEach(b => b.setAttribute("aria-pressed", state.types.has(b.dataset.val)));
    }
    if (Array.isArray(saved.priorities)) {
      state.priorities = new Set(saved.priorities);
      const grp = document.getElementById("priority-filter");
      [...grp.children].forEach(b => b.setAttribute("aria-pressed", state.priorities.has(b.dataset.val)));
    }
    if (saved.watch === "all" || saved.watch === "watched" || saved.watch === "unwatched" || saved.watch === "hidden") {
      state.watch = saved.watch;
      const grp = document.getElementById("watch-toggle-group");
      [...grp.children].forEach(b => b.setAttribute("aria-pressed", b.dataset.val === saved.watch));
    }
    if (typeof saved.sort === "string") {
      state.sort = saved.sort;
      document.getElementById("f-sort").value = saved.sort;
    }
  })();

  render();

  // ---------- time watched stats ----------
  const STAT_COLORS = { "Essential": "var(--seal-red)", "Recommended": "var(--accent)", "Completionist": "var(--moss)" };

  function bucketStats(list) {
    const withRuntime = list.filter(m => m.runtime != null);
    const watchedMin = withRuntime.filter(m => watched.has(m.id)).reduce((s, m) => s + m.runtime, 0);
    const totalMin = withRuntime.reduce((s, m) => s + m.runtime, 0);
    const remainingMin = totalMin - watchedMin;
    const pct = totalMin ? Math.round((watchedMin / totalMin) * 100) : 0;
    return { watchedMin, remainingMin, totalMin, pct, unknownCount: list.length - withRuntime.length };
  }

  function donutHTML(label, stats, color) {
    return `
    <div class="stat-card">
      <div class="stat-card-title">${escapeHTML(label)}</div>
      <div class="donut" style="--pct:${stats.pct}; --donut-color:${color}">
        <div class="donut-hole">
          <div class="donut-pct">${stats.pct}%</div>
          <div class="donut-hours">${readableRuntime(stats.watchedMin)} watched</div>
        </div>
      </div>
      <div class="stat-legend">
        <div><span class="dot" style="background:${color}"></span>Watched — ${readableRuntime(stats.watchedMin)}</div>
        <div><span class="dot" style="background:var(--border)"></span>Remaining — ${readableRuntime(stats.remainingMin)}</div>
      </div>
    </div>`;
  }

  function renderStats() {
    const visible = MOVIES.filter(m => !hidden.has(m.id));
    const overall = bucketStats(visible);

    const priorityCards = ["Essential", "Recommended", "Completionist"].map(p =>
      donutHTML(p, bucketStats(visible.filter(m => m.priority === p)), STAT_COLORS[p])
    ).join("");

    const typeCards = ["Movies", "TV Series", "Specials"].map(t =>
      donutHTML(t, bucketStats(visible.filter(m => TYPE_GROUP[m.type] === t)), "var(--accent)")
    ).join("");

    const unknownNote = overall.unknownCount
      ? `<p class="stats-footnote">+${overall.unknownCount} title${overall.unknownCount === 1 ? "" : "s"} with runtime not yet announced — excluded from these totals.</p>`
      : "";

    document.getElementById("stats-body").innerHTML = `
      <div class="stats-section">
        <div class="stat-grid" style="max-width:220px;margin:0 auto;">
          ${donutHTML("Overall", overall, "var(--moss)")}
        </div>
        ${unknownNote}
      </div>
      <div class="stats-section">
        <h3 class="stats-section-title">By priority</h3>
        <div class="stat-grid">${priorityCards}</div>
      </div>
      <div class="stats-section">
        <h3 class="stats-section-title">By type</h3>
        <div class="stat-grid">${typeCards}</div>
      </div>
    `;
  }

  const statsView = document.getElementById("stats-view");
  document.getElementById("stats-trigger").addEventListener("click", () => {
    renderStats();
    statsView.hidden = false;
  });
  document.getElementById("stats-close").addEventListener("click", () => { statsView.hidden = true; });

  // ---------- movie detail view ----------
  // m.synopsis / m.cast aren't in the data set yet (MOVIES only carries the
  // fields listed in FIELDS above) — these blocks render automatically once
  // that data exists, and are simply omitted until then rather than showing
  // placeholder/fabricated text for real, identifiable titles.
  function detailViewHTML(m) {
    const posterFile = POSTER_FILES[m.id];
    const isWatched = watched.has(m.id);
    const isHidden = hidden.has(m.id);
    const priorityVar = m.priority ? PRIORITY_VAR[m.priority] : null;
    const priorityColor = priorityVar ? `var(${priorityVar})` : "var(--ink-muted)";
    const typeLabel = TYPE_LABEL[m.type] || m.type;
    const doomsdayVal = m.doomsday != null ? m.doomsday + "%" : "—";
    const rtCritics = m.rtCritics != null ? m.rtCritics + "%" : "—";
    const rtAudience = m.rtAudience != null ? m.rtAudience + "%" : "—";

    const heroHTML = posterFile
      ? `<div class="detail-hero">
           <img class="detail-hero-bg" src="${posterFile}" alt="" aria-hidden="true">
           <img class="detail-hero-poster" src="${posterFile}" alt="${escapeHTML(m.title)} poster">
         </div>`
      : `<div class="detail-hero no-art" style="background:${TYPE_TINT[m.type] || "#555"}"></div>`;

    const synopsisHTML = m.synopsis ? `
      <div class="detail-block">
        <h3>Synopsis</h3>
        <p>${escapeHTML(m.synopsis)}</p>
      </div>` : "";

    const castHTML = (m.cast && m.cast.length) ? `
      <div class="detail-block">
        <h3>Cast</h3>
        <p>${m.cast.map(escapeHTML).join(" · ")}</p>
      </div>` : "";

    return `
      ${heroHTML}
      <div class="detail-container">
        <div class="detail-title-row">
          <h1 class="detail-movie-title">${escapeHTML(m.title)}</h1>
          ${m.priority ? `<span class="detail-priority-badge" style="color:${priorityColor};border-color:${priorityColor}">${m.priority}</span>` : ""}
        </div>
        <div class="detail-meta-row">
          <span>${typeLabel}</span><span>·</span><span>${escapeHTML(m.setIn)}</span><span>·</span><span>${readableRuntime(m.runtime)}</span><span>·</span><span>Released ${formatReleaseDate(m.releaseDate)}</span>
        </div>
        <div class="detail-actions">
          <button type="button" class="detail-action-btn watch${isWatched ? " active" : ""}" data-action="toggle" data-id="${m.id}">${isWatched ? "✓ Watched" : "Mark watched"}</button>
          <button type="button" class="detail-action-btn hide${isHidden ? " active" : ""}" data-action="hide" data-id="${m.id}">${isHidden ? "Unhide" : "Hide from my list"}</button>
        </div>
        ${synopsisHTML}
        ${castHTML}
        <div class="detail-block">
          <h3>Doomsday relevance</h3>
          <div class="detail-meter">
            <div class="detail-meter-track"><div class="detail-meter-fill" style="width:${m.doomsday ?? 0}%; background:${doomsdayColor(m.doomsday)}"></div></div>
            <span class="mono">${doomsdayVal}</span>
          </div>
        </div>
        <div class="detail-block">
          <h3>Rotten Tomatoes</h3>
          <p>${rtCritics} critics · ${rtAudience} audience</p>
        </div>
        <div class="detail-block">
          <h3>Post-credits scene</h3>
          <p>${escapeHTML(m.postCredits || "—")}</p>
        </div>
        <div class="detail-block">
          <h3>Why it matters</h3>
          <p>${escapeHTML(m.notes)}</p>
        </div>
      </div>
    `;
  }

  const detailView = document.getElementById("detail-view");
  function openDetailView(id) {
    const m = MOVIES.find(mv => mv.id === id);
    if (!m) return;
    document.getElementById("detail-title-head").textContent = m.title;
    document.getElementById("detail-body").innerHTML = detailViewHTML(m);
    detailView.hidden = false;
  }
  document.getElementById("detail-close").addEventListener("click", () => { detailView.hidden = true; });
  document.getElementById("detail-body").addEventListener("click", e => {
    const btn = e.target.closest(".detail-action-btn");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    if (btn.classList.contains("watch")) {
      const nowWatched = toggleWatched(id);
      btn.classList.toggle("active", nowWatched);
      btn.textContent = nowWatched ? "✓ Watched" : "Mark watched";
      updateStats();
    } else if (btn.classList.contains("hide")) {
      const nowHidden = toggleHidden(id);
      btn.classList.toggle("active", nowHidden);
      btn.textContent = nowHidden ? "Unhide" : "Hide from my list";
      updateStats();
    }
    render();
  });

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (!detailView.hidden) detailView.hidden = true;
    else if (!statsView.hidden) statsView.hidden = true;
  });

  // ---------- changelog ----------
  function renderChangelogEntries(entries) {
    return entries.map(e => `
      <div class="changelog-entry">
        <h3>v${escapeHTML(e.version)}</h3>
        <div class="changelog-date">${escapeHTML(e.date || "")}</div>
        <ul>${(e.changes || []).map(c => `<li>${escapeHTML(c)}</li>`).join("")}</ul>
      </div>`).join("");
  }

  function openChangelogModal(entries, latestVersion) {
    document.getElementById("changelog-body").innerHTML = renderChangelogEntries(entries);
    const backdrop = document.getElementById("changelog-backdrop");
    backdrop.hidden = false;
    const close = () => {
      backdrop.hidden = true;
      if (latestVersion) localStorage.setItem(CHANGELOG_SEEN_KEY, latestVersion);
    };
    document.getElementById("changelog-ok").onclick = close;
    document.getElementById("changelog-close").onclick = close;
    backdrop.onclick = e => { if (e.target === backdrop) close(); };
  }

  async function initChangelog() {
    let entries;
    try {
      const res = await fetch(CHANGELOG_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("changelog fetch failed: " + res.status);
      entries = await res.json();
      if (!Array.isArray(entries) || !entries.length) throw new Error("empty changelog");
    } catch (e) {
      entries = CHANGELOG_FALLBACK;
    }
    entries = entries.slice().sort((a, b) => compareVersions(b.version, a.version));
    const latest = entries[0].version;

    const badge = document.getElementById("version-badge");
    badge.textContent = "v" + latest;
    badge.hidden = false;
    badge.addEventListener("click", () => openChangelogModal(entries, null));

    const seen = localStorage.getItem(CHANGELOG_SEEN_KEY);
    if (seen === null) {
      // First-ever visit: nothing to announce, just baseline silently.
      localStorage.setItem(CHANGELOG_SEEN_KEY, latest);
      return;
    }
    if (compareVersions(seen, latest) < 0) {
      const unseen = entries.filter(e => compareVersions(e.version, seen) > 0);
      openChangelogModal(unseen.length ? unseen : entries, latest);
    }
  }
  initChangelog();
})();
</script>
</body>
</html>
