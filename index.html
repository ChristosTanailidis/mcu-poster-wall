<header>

    <div class="title-block">
      <h1>MCU Poster Wall</h1>
      <button type="button" class="version-badge" id="version-badge" hidden></button>
    </div>
    <div class="bar-controls">
      <input type="search" id="q" placeholder="Search…" autocomplete="off">
      <button type="button" id="filters-toggle" class="filters-btn" aria-expanded="false" aria-controls="filters-panel">
        Filters<span class="filter-count" id="filter-count" hidden>0</span>
      </button>
      <div class="seg" id="view-toggle-group" role="group" aria-label="Grid or list view">
        <button type="button" data-val="grid" aria-pressed="true" aria-label="Grid view" title="Grid view">
          <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.2"/><rect x="9" y="1" width="6" height="6" rx="1.2"/><rect x="1" y="9" width="6" height="6" rx="1.2"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></svg>
        </button>
        <button type="button" data-val="list" aria-pressed="false" aria-label="List view" title="List view">
          <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="3" height="3" rx="0.6"/><rect x="1" y="6.5" width="3" height="3" rx="0.6"/><rect x="1" y="11" width="3" height="3" rx="0.6"/><rect x="6" y="3" width="9" height="1.4" rx="0.7"/><rect x="6" y="7.5" width="9" height="1.4" rx="0.7"/><rect x="6" y="12" width="9" height="1.4" rx="0.7"/></svg>
        </button>
      </div>
    </div>
    <div class="spacer"></div>
    <button type="button" class="progress-text" id="stats-trigger">
      <span class="progress-ring" id="progress-ring" style="--pct:0">
        <span class="progress-ring-pct" id="progress-ring-pct">0%</span>
      </span>
      <span class="progress-copy">
        <span><b id="watched-count">0</b> / <span id="total-count">0</span> watched</span>
        <span class="progress-cta">View more <span class="progress-chevron" aria-hidden="true">›</span></span>
      </span>
    </button>
  </div>
  <div class="bar filters-panel" id="filters-panel">
    <div class="seg multi" id="type-filter" role="group" aria-label="Filter by type (multiple)">
      <button type="button" data-val="Movies" aria-pressed="false">Movies</button>
      <button type="button" data-val="TV Series" aria-pressed="false">TV Series</button>
      <button type="button" data-val="Specials" aria-pressed="false">Specials</button>
    </div>
    <div class="seg multi" id="priority-filter" role="group" aria-label="Filter by priority (multiple)">
      <button type="button" data-val="Essential" aria-pressed="false">Essential</button>
      <button type="button" data-val="Recommended" aria-pressed="false">Recommended</button>
      <button type="button" data-val="Completionist" aria-pressed="false">Completionist</button>
    </div>
    <div class="seg" id="watch-toggle-group" role="group" aria-label="Filter by watched status">
      <button type="button" data-val="all" aria-pressed="true">All</button>
      <button type="button" data-val="unwatched" aria-pressed="false">Unwatched</button>
      <button type="button" data-val="watched" aria-pressed="false">Watched</button>
      <button type="button" data-val="hidden" aria-pressed="false">Hidden</button>
    </div>
    <select id="f-sort">
      <option value="chrono">Sort: Story Order</option>
      <option value="release">Sort: Release Date</option>
      <option value="doomsday">Sort: Doomsday Link %</option>
      <option value="rt">Sort: RT Critics %</option>
      <option value="priority">Sort: Priority</option>
      <option value="title">Sort: Title A–Z</option>
    </select>
    <button type="button" id="clear-filters" class="clear-filters-btn">Clear all filters</button>
  </div>
</header>
